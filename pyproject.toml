[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-slo-alert-lab"
version = "0.1.0"
description = "Production-shaped SRE lab for SLO burn-rate evaluation and alert routing."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "prometheus-client>=0.20,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.5,<1"
]

[project.scripts]
slo-alert-lab = "prometheus_slo_alert_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
